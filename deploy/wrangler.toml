name = "deadline-dashboard"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 평소 갱신은 화면의 '지금 동기화' 버튼으로 한다. 크론은 하루 1회만 남긴다.
#
# 왜 아예 끄지 않나: 달력 URL 이 만료되면 조용히 깨진다. 버튼을 안 누르는 날에는
# 그 사실조차 모른다. 하루 1회가 그 감지기다 (sync_log 에 ok=0 으로 남는다).
# 그리고 아침에 열었을 때 이미 최신인 편이 낫다.
#
# 시각은 UTC 다. 22:13 UTC = 07:13 KST.
[triggers]
crons = ["13 22 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "deadline"
database_id = "89c1a9df-c620-43f9-94d0-b45e0d8fb899"

[assets]
directory = "public"
binding = "ASSETS"

# 비밀값은 여기에 쓰지 않는다. wrangler secret put 으로 넣는다.
#   wrangler secret put ICS_URL      이캠퍼스 달력 URL
#   wrangler secret put APP_TOKEN    이 페이지를 열 때 쓸 임의의 긴 문자열
